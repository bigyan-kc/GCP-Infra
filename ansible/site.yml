---
- name: Prepare Kubernetes nodes
  hosts: kube_master:kube_workers
  become: true

  vars:
    kube_packages:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - conntrack
      - ipset
      - socat
      - util-linux

    kubernetes_packages:
      - kubelet
      - kubeadm
      - kubectl

  tasks:

    # ---------------------------------------------------------
    # OS preparation
    # ---------------------------------------------------------

    - name: Install required OS packages
      ansible.builtin.apt:
        name: "{{ kube_packages }}"
        state: present
        update_cache: true

    - name: Disable swap immediately
      ansible.builtin.command:
        cmd: swapoff -a
      when: ansible_swaptotal_mb > 0

    - name: Disable swap in /etc/fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\s+swap\s+.*)$'
        replace: '# \1'
        backup: true
      when: ansible_swaptotal_mb > 0

    # ---------------------------------------------------------
    # Kernel configuration
    # ---------------------------------------------------------

    - name: Load br_netfilter kernel module
      community.general.modprobe:
        name: br_netfilter
        state: present

    - name: Ensure br_netfilter loads on boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/kubernetes.conf
        content: |
          br_netfilter
        owner: root
        group: root
        mode: "0644"

    - name: Configure Kubernetes sysctl settings
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: true
        sysctl_set: true
      loop:
        - name: net.bridge.bridge-nf-call-iptables
          value: "1"
        - name: net.bridge.bridge-nf-call-ip6tables
          value: "1"
        - name: net.ipv4.ip_forward
          value: "1"

    # ---------------------------------------------------------
    # Containerd
    # ---------------------------------------------------------

    - name: Install containerd
      ansible.builtin.apt:
        name: containerd
        state: present
        update_cache: true

    - name: Create containerd configuration directory
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Generate containerd default configuration
      ansible.builtin.command:
        cmd: containerd config default
      register: containerd_default_config
      changed_when: false

    - name: Write containerd configuration
      ansible.builtin.copy:
        content: "{{ containerd_default_config.stdout }}"
        dest: /etc/containerd/config.toml
        owner: root
        group: root
        mode: "0644"

    - name: Enable SystemdCgroup for containerd
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: '^\s*SystemdCgroup\s*=\s*false'
        replace: '            SystemdCgroup = true'
      notify: Restart containerd

    - name: Ensure containerd is enabled and running
      ansible.builtin.service:
        name: containerd
        state: started
        enabled: true

    # ---------------------------------------------------------
    # Kubernetes repository
    # ---------------------------------------------------------

    - name: Create Kubernetes keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Kubernetes repository signing key
      ansible.builtin.get_url:
        url: https://pkgs.k8s.io/core:/stable:/v1.34/deb/Release.key
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        mode: "0644"

    - name: Add Kubernetes repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc]
          https://pkgs.k8s.io/core:/stable:/v1.34/deb/
          /
        state: present
        filename: kubernetes

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    # ---------------------------------------------------------
    # Kubernetes packages
    # ---------------------------------------------------------

    - name: Install Kubernetes packages
      ansible.builtin.apt:
        name: "{{ kubernetes_packages }}"
        state: present

    - name: Hold Kubernetes packages
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: "{{ kubernetes_packages }}"

    - name: Enable kubelet
      ansible.builtin.service:
        name: kubelet
        enabled: true
        state: started

  handlers:

    - name: Restart containerd
      ansible.builtin.service:
        name: containerd
        state: restarted


# =============================================================
# Kubernetes control plane
# =============================================================

- name: Initialize Kubernetes control plane
  hosts: kube_master
  become: true

  tasks:

    - name: Initialize Kubernetes control plane
      ansible.builtin.command:
        cmd: kubeadm init --pod-network-cidr=10.244.0.0/16
      args:
        creates: /etc/kubernetes/admin.conf
      register: kubeadm_init

    - name: Create root kubeconfig directory
      ansible.builtin.file:
        path: /root/.kube
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Copy admin kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: true
        owner: root
        group: root
        mode: "0600"

    - name: Wait for Kubernetes API server
      ansible.builtin.command:
        cmd: kubectl get nodes
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: kubectl_ready
      retries: 20
      delay: 10
      until: kubectl_ready.rc == 0
      changed_when: false

    - name: Deploy Flannel CNI
      ansible.builtin.command:
        cmd: >-
          kubectl apply
          -f https://raw.githubusercontent.com/flannel-io/flannel/master/Documentation/kube-flannel.yml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: flannel_apply
      changed_when: "'created' in flannel_apply.stdout or 'configured' in flannel_apply.stdout"

    - name: Generate worker join command
      ansible.builtin.command:
        cmd: kubeadm token create --print-join-command
      register: kubeadm_join
      changed_when: false

    - name: Store worker join command
      ansible.builtin.set_fact:
        kubeadm_join_command: "{{ kubeadm_join.stdout }}"


# =============================================================
# Kubernetes workers
# =============================================================

- name: Join worker nodes
  hosts: kube_workers
  become: true

  tasks:

    - name: Join worker node to Kubernetes cluster
      ansible.builtin.command:
        cmd: "{{ hostvars[groups['kube_master'][0]].kubeadm_join_command }}"
      args:
        creates: /etc/kubernetes/kubelet.conf


- name: Deploy Keycloak on a dedicated VM
  hosts: keycloak
  become: true

  vars:
    keycloak_version: "21.1.2"
    keycloak_admin_user: "admin"
    keycloak_admin_password: "admin"

  tasks:

    - name: Update apt cache on Keycloak host
      ansible.builtin.apt:
        update_cache: true

    - name: Install Docker prerequisites
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Add Docker GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        keyring: /usr/share/keyrings/docker-archive-keyring.gpg
        state: present

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present
        update_cache: yes

    - name: Install Docker Engine
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present

    - name: Ensure docker is enabled and running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Pull Keycloak image
      ansible.builtin.command:
        cmd: docker pull quay.io/keycloak/keycloak:{{ keycloak_version }}
      register: keycloak_pull
      changed_when: false

    - name: Create Keycloak data directory
      ansible.builtin.file:
        path: /opt/keycloak/data
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Ensure Keycloak container is running
      ansible.builtin.shell: |
        if ! docker container inspect keycloak >/dev/null 2>&1; then
          docker run -d --name keycloak \
            -p 8080:8080 \
            -e KEYCLOAK_ADMIN={{ keycloak_admin_user }} \
            -e KEYCLOAK_ADMIN_PASSWORD={{ keycloak_admin_password }} \
            -v /opt/keycloak/data:/opt/keycloak/data \
            quay.io/keycloak/keycloak:{{ keycloak_version }} start-dev
        fi
      args:
        executable: /bin/bash