name: Terraform CI/CD

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose terraform action to run'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Validate and Plan
    runs-on: ubuntu-latest
    env:
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: latest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Terraform fmt check
        run: terraform fmt -check

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

  apply:
    name: Apply to GCP
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
    needs: terraform
    runs-on: ubuntu-latest
    environment: production
    env:
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: latest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve -var-file=terraform.tfvars
      
      - name: Get Terraform outputs
        run: terraform output -json > terraform-output.json

      - name: Upload Terraform outputs
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs
          path: terraform-output.json

  destroy:
    name: Destroy GCP resources
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    needs: terraform
    runs-on: ubuntu-latest
    environment: production
    env:
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: latest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform destroy
        run: terraform destroy -input=false -auto-approve -var-file=terraform.tfvars
  
  ansible:
    name: Configure infrastructure
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
    needs: apply
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download Terraform outputs
        uses: actions/download-artifact@v4
        with:
          name: terraform-outputs

      - name: Generate Ansible inventory
        run: |
          BASTION_IP=$(jq -r '.bastion_public_ip.value' terraform-output.json)
          MASTER_IP=$(jq -r '.master_instance_internal_ip.value' terraform-output.json)

          WORKER_IPS=$(jq -r '.worker_instance_internal_ips.value[]' terraform-output.json)

          cat > ansible/inventory.ini <<EOF
          [kube_master]
          kube-master ansible_host=${MASTER_IP}

          [kube_workers]
          EOF

          i=1
          for IP in $WORKER_IPS; do
            echo "kube-worker${i} ansible_host=${IP}" >> ansible/inventory.ini
            i=$((i + 1))
          done

          cat >> ansible/inventory.ini <<EOF

          [all:vars]
          ansible_user=safal
          ansible_ssh_private_key_file=~/.ssh/id_rsa
          ansible_python_interpreter=/usr/bin/python3
          ansible_become=yes
          ansible_ssh_common_args='-o ProxyCommand="ssh -W %h:%p -q safal@${BASTION_IP} -i ~/.ssh/id_rsa" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
          EOF

          cat ansible/inventory.ini

      - name: Install Ansible
        run: |
          python3 -m pip install --upgrade pip
          pip install ansible

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
      
      - name: Disable SSH host key checking
        run: |
          cat > ~/.ssh/config <<EOF
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

          chmod 600 ~/.ssh/config

      - name: Wait for SSH
        run: |
          for host in $(awk '/ansible_host=/ {print $2}' ansible/inventory.ini | cut -d= -f2); do
            echo "Waiting for SSH on $host..."

            for i in {1..30}; do
              if nc -z "$host" 22; then
                echo "$host is ready"
                break
              fi

              sleep 10
            done
          done

      - name: Run Ansible
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/site.yml
